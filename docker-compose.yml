# ---------------------------------------------------------------
# personapi-dotnet: monolito MVC + DAO y su base de datos.
# Un solo servicio de aplicación (el monolito) + SQL Server 2022.
# "db-init" es un contenedor de un solo uso que ejecuta los scripts
# DDL y DML y termina; no es parte de la arquitectura en ejecución.
#
# Uso:  copiar .env.example a .env, poner la contraseña y luego
#       docker compose up --build      (o F5 en Visual Studio con
#       el proyecto docker-compose como proyecto de inicio)
# ---------------------------------------------------------------
name: personapi-dotnet

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: personapi-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"              # misma edición que en la guía del equipo
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:?Defina SA_PASSWORD en el archivo .env}"
    ports:
      - "14333:1433"                    # SSMS desde Windows: localhost,14333
    volumes:
      - sqlserver-data:/var/opt/mssql   # los datos sobreviven a "docker compose down"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -b -Q \"SELECT 1\" -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: personapi-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SA_PASSWORD: "${SA_PASSWORD}"
    volumes:
      - ./Scripts:/scripts:ro
    # Los scripts son idempotentes: se pueden ejecutar en cada arranque.
    # Reintenta porque SQL Server puede aceptar "SELECT 1" (healthcheck) antes
    # de terminar de preparar las bases del sistema en el primer arranque.
    entrypoint:
      - /bin/bash
      - -c
      - |
        echo "Scripts montados en /scripts:"; ls -l /scripts
        for f in 01_ddl.sql 02_dml.sql; do
          [ -f "/scripts/$$f" ] || { echo "ERROR: falta /scripts/$$f (revise la carpeta Scripts junto a docker-compose.yml)"; exit 1; }
        done
        for i in $$(seq 1 10); do
          echo "Intento $$i: ejecutando DDL y DML..."
          /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$SA_PASSWORD" -C -b -f 65001 -i /scripts/01_ddl.sql,/scripts/02_dml.sql && { echo "db-init OK"; exit 0; }
          sleep 5
        done
        echo "ERROR: los scripts fallaron 10 veces; el mensaje de sqlcmd esta arriba."
        exit 1
    restart: "no"

  personapi-dotnet:
    image: ${DOCKER_REGISTRY-}personapidotnet
    container_name: personapi-app
    build:
      context: .
      dockerfile: personapi-dotnet/Dockerfile
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      # Sobrescribe ConnectionStrings:DefaultConnection de appsettings.json.
      # El código (DAO / DbContext) no cambia: solo cambia la configuración.
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=persona_db;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
    ports:
      - "8080:8080"                     # http://localhost:8080  y  /swagger

volumes:
  sqlserver-data: